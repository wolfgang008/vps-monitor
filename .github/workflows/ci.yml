name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bash syntax
        run: bash -n TG-check-notify.sh tests/test.sh
      - name: Script checksum
        run: sha256sum --check TG-check-notify.sh.sha256
      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: ShellCheck
        run: shellcheck TG-check-notify.sh tests/test.sh
      - name: Behavior tests
        run: bash tests/test.sh
