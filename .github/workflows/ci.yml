name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n TG-check-notify.sh tests/test.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: ShellCheck
        run: shellcheck TG-check-notify.sh tests/test.sh
      - name: Behavior tests
        run: bash tests/test.sh
